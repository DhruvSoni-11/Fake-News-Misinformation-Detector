<!DOCTYPE html>
<!-- browser-extension/popup.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Credibility Analyzer</title>
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; background: #6366f1; color: #fff;
             border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #result { margin-top: 12px; }
    .score-bar { height: 12px; border-radius: 6px; background: #e5e7eb; margin-top: 6px; }
    .score-fill { height: 100%; border-radius: 6px; transition: width 0.4s; }
    .label { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
             font-size: 0.7rem; font-weight: 700; color: #fff; }
    .low    { background: #22c55e; }
    .medium { background: #f59e0b; }
    .high   { background: #ef4444; }
    .sources { margin-top: 10px; font-size: 0.78rem; }
    .sources a { color: #6366f1; }
    .error { color: #ef4444; font-size: 0.82rem; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>🔍 AI Credibility Analyzer</h2>
  <button id="analyzeBtn">Analyze This Page</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
